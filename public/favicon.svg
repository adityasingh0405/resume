<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Cyber Neon Gradients -->
    <linearGradient id="pegasusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00ff9d" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="wingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="40%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="1" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes cyberPulse {
        0%, 100% { filter: drop-shadow(0 0 2px #00f0ff) drop-shadow(0 0 6px rgba(0, 240, 255, 0.6)); }
        50% { filter: drop-shadow(0 0 4px #00ff9d) drop-shadow(0 0 10px rgba(0, 255, 157, 0.85)); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .glowing-wing {
        animation: cyberPulse 3s ease-in-out infinite;
      }
      .terminal-cursor {
        animation: blinkCursor 1s steps(1) infinite;
      }
    </style>
  </defs>

  <!-- Background: CRT Bezel / Cyber Cartridge Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bezelGrad)" stroke="#00f0ff" stroke-width="1.75" stroke-opacity="0.8" />
  
  <!-- Inner CRT Screen Plate -->
  <rect x="5" y="5" width="54" height="54" rx="11" fill="#030712" />

  <!-- Cyber Grid Matrix (Background subtle lines) -->
  <g opacity="0.18" stroke="#00f0ff" stroke-width="0.75">
    <line x1="5" y1="18" x2="59" y2="18" />
    <line x1="5" y1="32" x2="59" y2="32" />
    <line x1="5" y1="46" x2="59" y2="46" />
    <line x1="18" y1="5" x2="18" y2="59" />
    <line x1="32" y1="5" x2="32" y2="59" />
    <line x1="46" y1="5" x2="46" y2="59" />
  </g>

  <!-- Corner Sci-Fi Bracket Reticles -->
  <path d="M 8 16 L 8 8 L 16 8" fill="none" stroke="#00ff9d" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 48 8 L 56 8 L 56 16" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 8 48 L 8 56 L 16 56" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 48 56 L 56 56 L 56 48" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  <!-- Main Cyber Emblem: Stylized PEGASUS 'P' + Cybernetic Blade Wings -->
  <g class="glowing-wing" filter="url(#neonGlow)">
    <!-- Cyber Wing Blade 1 (Top sweeping feather) -->
    <path d="M 28 12 L 48 12 L 53 17 L 39 19 L 28 17 Z" fill="url(#wingGrad)" opacity="0.9" />
    
    <!-- Cyber Wing Blade 2 (Main middle wing thruster) -->
    <path d="M 27 19 L 55 21 L 58 27 L 36 28 L 26 25 Z" fill="url(#pegasusGrad)" />

    <!-- Cyber Wing Blade 3 (Lower supersonic blade) -->
    <path d="M 26 27 L 50 31 L 46 36 L 26 33 Z" fill="url(#wingGrad)" opacity="0.85" />

    <!-- Pegasus 'P' Monogram Stem (Tech Pillar) -->
    <path d="M 14 12 L 23 12 L 23 52 L 14 52 Z" fill="url(#pegasusGrad)" />
    <!-- Inner Notch cutouts on P stem for tech/chip look -->
    <rect x="17" y="16" width="3" height="12" fill="#030712" rx="1" />
    <rect x="17" y="34" width="3" height="14" fill="#030712" rx="1" />

    <!-- Pegasus 'P' Upper Head / Arch Loop -->
    <path d="M 23 12 L 35 12 C 43 12 45 19 45 23 C 45 29 40 33 33 33 L 23 33 Z" fill="url(#pegasusGrad)" />
    <!-- 'P' Hollow Eye -->
    <rect x="23" y="17" width="11" height="11" rx="2" fill="#030712" />

    <!-- Cyber Circuit Accent Nodes inside P -->
    <circle cx="28" cy="22" r="2.5" fill="url(#coreGrad)" filter="url(#neonGlow)" />

    <!-- Retro Terminal Prompt Arrow & Cursor below loop -->
    <path d="M 27 40 L 32 44 L 27 48" fill="none" stroke="#00ff9d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="36" y="41.5" width="7" height="5" fill="#00f0ff" class="terminal-cursor" />
  </g>

  <!-- Power Status LED / Tech Badge -->
  <circle cx="53" cy="53" r="2" fill="#00ff9d" filter="url(#intenseGlow)" />
</svg>