<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- S.H.I.E.L.D. Neon Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00ff65" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <filter id="shieldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes shieldPulse {
        0%, 100% { filter: drop-shadow(0 0 2px #00ff65) drop-shadow(0 0 6px rgba(0, 255, 101, 0.6)); }
        50% { filter: drop-shadow(0 0 4px #00f0ff) drop-shadow(0 0 10px rgba(0, 240, 255, 0.85)); }
      }
      .glowing-shield {
        animation: shieldPulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- CRT Bezel Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bezelGrad)" stroke="#00ff65" stroke-width="1.75" stroke-opacity="0.8" />
  
  <!-- Inner CRT Screen Plate -->
  <rect x="5" y="5" width="54" height="54" rx="11" fill="#030712" />

  <!-- S.H.I.E.L.D. Insignia Crest -->
  <g class="glowing-shield" filter="url(#shieldGlow)" fill="url(#shieldGrad)" stroke="#00ff65" stroke-width="1">
    <circle cx="32" cy="32" r="23" fill="none" stroke-width="1.5" />
    <circle cx="32" cy="32" r="20" fill="none" stroke-width="0.75" stroke-dasharray="2 2" />
    <!-- Eagle stylized silhouette -->
    <path d="M 32 14 L 38 23 L 49 25 L 45 33 L 53 38 L 43 43 L 41 53 L 32 49 L 23 53 L 21 43 L 11 38 L 19 33 L 15 25 L 26 23 Z" />
    <circle cx="32" cy="32" r="3" fill="#030712" stroke="none" />
  </g>

  <!-- Power Status LED -->
  <circle cx="53" cy="53" r="2" fill="#00ff65" />
</svg>